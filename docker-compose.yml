services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    container_name: f1-db
    user: "0:0"
    restart: always
    environment:
      SA_PASSWORD: "${DB_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: f1-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, login with RABBITMQ_USER / RABBITMQ_PASS
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  webapi:
    build:
      context: .
      dockerfile: F1Info&Tickets.WebAPI/Dockerfile
    container_name: f1-api
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "${CONNECTION_STRING}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      RabbitMQ__Host: "${RABBITMQ_HOST}"
      RabbitMQ__Port: "${RABBITMQ_PORT}"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASS}"
      PayPal__ClientId: "${PAYPAL_CLIENT_ID}"
      PayPal__Secret: "${PAYPAL_SECRET}"
      PayPal__Mode: "${PAYPAL_MODE}"
      PayPal__Currency: "${PAYPAL_CURRENCY}"
    ports:
      - "5174:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - uploads:/app/wwwroot/uploads

  worker:
    build:
      context: .
      dockerfile: F1Info&Tickets.Worker/Dockerfile
    container_name: f1-worker
    restart: on-failure
    environment:
      RabbitMQ__Host: "${RABBITMQ_HOST}"
      RabbitMQ__Port: "${RABBITMQ_PORT}"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASS}"
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT}"
      Smtp__Username: "${SMTP_USER}"
      Smtp__Password: "${SMTP_PASS}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL}"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mssqldata:
  rabbitmq_data:
  uploads:
